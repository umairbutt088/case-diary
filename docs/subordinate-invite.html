<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Diary — subordinate invite</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #f5f5f5;
      max-width: 28em;
      margin: 0 auto;
      line-height: 1.45;
    }
    a.button {
      display: inline-block;
      margin: 12px 0;
      padding: 16px 22px;
      background: #111;
      color: #fff !important;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    a.button.secondary {
      background: #fff;
      color: #111 !important;
      border: 1px solid #ccc;
    }
    .hint {
      font-size: 0.92rem;
      color: #333;
    }
    .err {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 1.25rem; margin-top: 0">Join as subordinate</h1>
  <p class="hint">
    Install Case Diary for Lawyers if you do not have it yet, then tap <strong>Open invite</strong>.
  </p>
  <a id="store-link" class="button secondary" href="https://play.google.com/store/apps/details?id=com.umairbutt.legaldiary">
    Get app on Google Play
  </a>
  <a id="open-link" class="button" href="#" role="button">Open invite</a>
  <p id="error" class="err" style="display: none"></p>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var token = (params.get("token") || "").trim();
      var openLink = document.getElementById("open-link");
      var errorEl = document.getElementById("error");

      if (!token) {
        document.querySelector("h1").textContent = "Invalid invite";
        document.querySelector(".hint").style.display = "none";
        document.getElementById("store-link").style.display = "none";
        openLink.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = "This invite link is missing a token. Ask your supervisor for a new link.";
        return;
      }

      var appUrl =
        "legaldiary://subordinate-invite?token=" + encodeURIComponent(token);

      openLink.addEventListener("click", function (ev) {
        ev.preventDefault();
        try {
          window.location.assign(appUrl);
        } catch (e1) {
          window.location.href = appUrl;
        }
      });
    })();
  </script>
</body>
</html>
