<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Diary — password reset</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #f5f5f5;
      max-width: 28em;
      margin: 0 auto;
      line-height: 1.45;
    }
    a.button {
      display: inline-block;
      margin: 20px 0;
      padding: 16px 22px;
      background: #111;
      color: #fff !important;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .hint {
      font-size: 0.92rem;
      color: #333;
    }
    .err {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 1.25rem; margin-top: 0">Open Case Diary</h1>
  <p class="hint">
    <strong>Tap the black button</strong> — iOS and Gmail often block automatic opens. If you use
    <strong>Gmail</strong>, try <strong>⋮ → Open in Safari</strong>, then tap the button again. Stay on
    this page until you tap; the app will not open by itself.
  </p>
  <a id="open-link" class="button" href="#" role="button">Tap to open Case Diary</a>
  <p id="error" class="err" style="display: none"></p>

  <script>
    (function () {
      var hash = window.location.hash || "";
      var search = window.location.search || "";
      var appUrl = "";

      // Use ?query=… (not #fragment). iOS often drops the hash on custom schemes.
      // Very long href attributes are ignored in some browsers — keep href="#" and open via click + assign().
      if (hash.indexOf("access_token=") !== -1 || hash.indexOf("type=recovery") !== -1) {
        var raw = hash.charAt(0) === "#" ? hash.slice(1) : hash;
        try {
          var sp = new URLSearchParams(raw);
          var qs = sp.toString();
          if (qs.length > 3500) {
            appUrl = "legaldiary://reset-password?t=" + encodeURIComponent(raw);
          } else {
            appUrl = "legaldiary://reset-password?" + qs;
          }
        } catch (e1) {
          appUrl = "legaldiary://reset-password#" + raw;
        }
      } else if (search.indexOf("code=") !== -1) {
        var rawS = search.startsWith("?") ? search.slice(1) : search;
        var tail = hash && hash.charAt(0) === "#" ? hash.slice(1) : hash;
        var merged = tail ? rawS + "&" + tail : rawS;
        try {
          appUrl = "legaldiary://reset-password?" + new URLSearchParams(merged).toString();
        } catch (e2) {
          appUrl = "legaldiary://reset-password?" + merged;
        }
      } else if (hash.indexOf("error=") !== -1 || hash.indexOf("error_description=") !== -1) {
        document.querySelector("h1").textContent = "Link expired";
        document.getElementById("open-link").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
          "Request a new password reset from the Case Diary app.";
        return;
      }

      if (!appUrl) {
        document.querySelector("h1").textContent = "Not a reset link";
        document.querySelector(".hint").style.display = "none";
        document.getElementById("open-link").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
          "This page only works when opened from the password reset email (the URL must contain #access_token=…). Code playgrounds and blank tabs have no token — that is expected.";
        return;
      }

      var openLink = document.getElementById("open-link");
      openLink.href = "#";
      openLink.addEventListener("click", function (ev) {
        ev.preventDefault();
        try {
          window.location.assign(appUrl);
        } catch (e3) {
          window.location.href = appUrl;
        }
      });

      try {
        window.location.assign(appUrl);
      } catch (e4) {}
    })();
  </script>
</body>
</html>
