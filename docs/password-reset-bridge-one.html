<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Diary — password reset</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #f5f5f5;
      max-width: 28em;
      margin: 0 auto;
      line-height: 1.45;
    }
    a.button {
      display: inline-block;
      margin: 20px 0;
      padding: 16px 22px;
      background: #111;
      color: #fff !important;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .hint {
      font-size: 0.92rem;
      color: #333;
    }
    .err {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 1.25rem; margin-top: 0">Open Case Diary</h1>
  <p class="hint">
    Tap the black button below. If you use <strong>Gmail</strong>, you may need
    <strong>⋮ → Open in Chrome / Safari</strong> first, then tap the button again.
  </p>
  <a id="open-link" class="button" href="#">Tap to open Case Diary</a>
  <p id="error" class="err" style="display: none"></p>

  <script>
    (function () {
      var hash = window.location.hash || "";
      var search = window.location.search || "";
      var appUrl = "";

      if (hash.indexOf("access_token=") !== -1 || hash.indexOf("type=recovery") !== -1) {
        appUrl = "legaldiary://reset-password" + hash;
      } else if (search.indexOf("code=") !== -1) {
        appUrl = "legaldiary://reset-password" + search + hash;
      } else if (hash.indexOf("error=") !== -1 || hash.indexOf("error_description=") !== -1) {
        document.querySelector("h1").textContent = "Link expired";
        document.getElementById("open-link").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
          "Request a new password reset from the Case Diary app.";
        return;
      }

      if (!appUrl) {
        document.querySelector("h1").textContent = "Invalid link";
        document.getElementById("open-link").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
          "No reset token found. Request a new reset from the app.";
        return;
      }

      var openLink = document.getElementById("open-link");
      openLink.href = appUrl;

      // Optional auto-try (often blocked without a user tap).
      try {
        window.location.href = appUrl;
      } catch (e) {}
    })();
  </script>
</body>
</html>
