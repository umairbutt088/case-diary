<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Diary — password reset</title>
  <script>
    (function () {
      var hash = window.location.hash || "";
      var search = window.location.search || "";
      if (hash.indexOf("access_token=") !== -1 || hash.indexOf("type=recovery") !== -1) {
        window.location.replace("legaldiary://reset-password" + hash);
        return;
      }
      if (search.indexOf("code=") !== -1) {
        window.location.replace("legaldiary://reset-password" + search + hash);
        return;
      }
      if (hash.indexOf("error=") !== -1 || hash.indexOf("error_description=") !== -1) {
        document.write(
          "<body style=\"font-family:system-ui;padding:24px;max-width:28em\"><p>This reset link is invalid or expired. Open the Case Diary app and request a new password reset.</p></body>"
        );
      }
    })();
  </script>
</head>
<body style="font-family: system-ui; padding: 24px; background: #f5f5f5">
  <p style="max-width: 28em">
    Opening the Case Diary app… If nothing happens, open this email on your phone and ensure the app
    is installed, or install it from the App Store / Google Play and try again.
  </p>
</body>
</html>
